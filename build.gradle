plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

// Resilient to a large ZIP: GitHub uploads just one archive, while the build
// supplies the repaired resources to Minecraft from inside the mod JAR.
def uploadedShatsuPack = file('Shatsu_Satisfying_Sounds_v7.3_SOFT_GENERIC_HITS_EXPLOSIONS_26.3.zip')
tasks.register('prepareShatsuAssets', Exec) {
    inputs.file(uploadedShatsuPack)
    inputs.file(file('scripts/prepare_audio.py'))
    outputs.dir(layout.buildDirectory.dir('generated/shatsu-assets'))
    commandLine 'python3', 'scripts/prepare_audio.py', uploadedShatsuPack.absolutePath,
        layout.buildDirectory.dir('generated/shatsu-assets').get().asFile.absolutePath
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    // Stage the original v7.3 ZIP without modifying it in GitHub.
    // Audio repair only touches mining-hit samples, hit mapping gain,
    // and unclassified Clangor hits. All other user-approved audio is preserved.
    dependsOn tasks.named('prepareShatsuAssets')
    from(layout.buildDirectory.dir('generated/shatsu-assets')) {
        include 'assets/**'
        include 'pack.png'
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
