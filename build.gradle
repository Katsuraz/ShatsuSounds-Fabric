plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    // The original v7.3 resource-pack ZIP is committed at repository root.
    // Include its assets directly inside the Fabric JAR (no manual extraction).
    def pack = file('Shatsu_Satisfying_Sounds_v7.3_SOFT_GENERIC_HITS_EXPLOSIONS_26.3.zip')
    if (pack.isFile()) {
        inputs.file(pack)
        from(zipTree(pack)) {
            include 'assets/**'
            include 'pack.png'
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
