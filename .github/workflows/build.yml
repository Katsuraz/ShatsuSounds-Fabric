name: Shatsu Sounds Fabric 26.3 - Source Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Validate repository source structure
        run: python3 scripts/check_project.py
      - name: Compile Fabric mod source
        run: gradle build --stacktrace
      - name: Label asset state
        id: assets
        run: |
          if test -f audio/ShatsuSounds_v7.3_assets_only.zip; then
            echo "artifact=ShatsuSounds-ALPHA-AUDIO-INCLUDED-UNTESTED" >> "$GITHUB_OUTPUT"
            echo "Bundled audio archive detected and included in build."
          else
            echo "artifact=ShatsuSounds-ALPHA-UI-ONLY-NO-AUDIO" >> "$GITHUB_OUTPUT"
            echo "::warning::Shatsu v7.3 audio bundle is not yet committed; this JAR is source/UI only."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error
