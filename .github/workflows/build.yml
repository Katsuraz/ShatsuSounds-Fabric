name: Shatsu Sounds Fabric 26.3 - Source Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate repository source structure
        run: python3 scripts/check_project.py
      - name: Compile Fabric mod source
        run: gradle build --stacktrace
      - name: Label asset state
        run: |
          if test -e src/main/resources/assets/shatsuv7/sounds.json; then
            echo "Shatsu asset payload detected. Inspect resource counts before release."
          else
            echo "::warning::Shatsu v7.3 audio asset bundle is not yet committed. This JAR does not include the requested audio overhaul."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ShatsuSounds-ALPHA-UI-ONLY-until-assets-imported
          path: build/libs/*.jar
          if-no-files-found: error
