name: Shatsu Sounds Fabric 26.3
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'scripts/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify bundled audio catalog
        run: python3 scripts/verify_audio.py
      - name: Run catalog and preservation tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ShatsuSounds-Fabric-26.3-JAR
          path: build/libs/*.jar
          if-no-files-found: error
