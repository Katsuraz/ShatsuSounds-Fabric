name: Shatsu Sounds Fabric 26.3 - Full Audio Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Shatsu_Satisfying_Sounds_v7.3_SOFT_GENERIC_HITS_EXPLOSIONS_26.3.zip'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Validate repository source structure
        run: python3 scripts/check_project.py
      - name: Validate uploaded sound pack
        run: |
          python3 - <<'PY'
          import zipfile
          p = 'Shatsu_Satisfying_Sounds_v7.3_SOFT_GENERIC_HITS_EXPLOSIONS_26.3.zip'
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, f'Corrupt archive member: {bad}'
              names = set(z.namelist())
              assert 'assets/minecraft/sounds.json' in names
              assert any(n.endswith('.ogg') for n in names)
              print('Validated', len(names), 'sound-pack entries')
          PY
      - name: Compile Fabric mod source
        run: gradle build --stacktrace
      - name: Label asset state
        id: assets
        run: echo "artifact=ShatsuSounds-ALPHA-V7.3-AUDIO-UNTESTED" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error
