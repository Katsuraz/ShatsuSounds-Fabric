name: Pixel Eco Retro Edition — Build from Real Shatsu
on:
  push:
    branches: [pixel-eco-retro-v066]
    paths:
      - 'src/**'
      - 'audio/shatsu_v03/**'
      - 'Shatsu_Satisfying_Sounds_v7.3_SOFT_GENERIC_HITS_EXPLOSIONS_26.3.zip'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Validate repository source structure
        run: python3 scripts/check_project.py
      - name: Validate uploaded sound pack
        run: |
          python3 - <<'PY'
          import zipfile
          p = 'Shatsu_Satisfying_Sounds_v7.3_SOFT_GENERIC_HITS_EXPLOSIONS_26.3.zip'
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, f'Corrupt archive member: {bad}'
              names = set(z.namelist())
              assert 'assets/minecraft/sounds.json' in names
              assert any(n.endswith('.ogg') for n in names)
              print('Validated', len(names), 'sound-pack entries')
          PY
      - name: Install FFmpeg for hit-volume normalization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Install retro audio DSP libraries
        run: python3 -m pip install --disable-pip-version-check numpy scipy soundfile
      - name: Build the mod with original Shatsu code and retro audio
        run: gradle build --stacktrace
      - name: Make actual-audio preview from built retro library
        run: python3 scripts/retro_preview.py build/generated/shatsu-assets build/generated/pixel-eco-retro-preview.mp3
      - name: Verify Shatsu's original code and mod integration remain intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          root=Path("build/generated/shatsu-assets")
          report=json.loads((root/"pixeleco_retro_report.json").read_text())
          assert report["base_shatsu_ogg_count"]>=1500
          assert sum(n for cat,n in report["transformed_by_category"].items() if cat!="preserved")>=1000
          assert report["new_arcade_explosion_variants"]>=6
          assert "item.trident.throw" in json.loads((root/"assets/minecraft/sounds.json").read_text())
          jar=next(x for x in Path("build/libs").glob("*.jar") if "-sources" not in x.name)
          with zipfile.ZipFile(jar) as z:
            names=set(z.namelist())
            for must in ("assets/clangor/sounds.json",
                  "assets/customblocksounds/config/blockmap.json",
                  "assets/minecraft/sounds/items/shatsu_v7_totem_of_undying.json",
                  "dev/shatsu/sounds/client/ShatsuScreen.class",
                  "dev/shatsu/sounds/client/ShatsuGenericAttackFeedback.class",
                  "dev/shatsu/sounds/mixin/SoundEngineMixin.class"):
              assert must in names, must
          assert report["trident_reference"]["reference_path"] in names, report["trident_reference"]
          print("Shatsu original Java hooks, Trident reference, and companion integrations preserved")
          PY
      - name: Verify Alpha2 material-specific retro audio and variation safety
        run: |
          python3 - <<'PY'
          import json, pathlib, numpy as np, soundfile as sf
          root=pathlib.Path("build/generated/shatsu-assets")
          qa=json.loads((root/"pixeleco_interactions_qa.json").read_text())
          assert qa["modified_event_count"]==19
          assert qa["new_audio_variants"]==57
          sounds=json.loads((root/"assets/minecraft/sounds.json").read_text())
          paths=[]
          for event,kind in qa["events"].items():
              assert event in sounds
              refs=sounds[event]["sounds"]
              assert len(refs)==3 and sounds[event]["replace"]
              for entry in refs:
                  assert entry["name"].startswith("pixelecoretro:physical/"+kind+"/")
                  rel=entry["name"].split(":",1)[1]
                  path=root/"assets/pixelecoretro/sounds"/(rel+".ogg")
                  assert path.is_file(),path
                  paths.append(path)
                  audio,rate=sf.read(path,dtype="float32")
                  assert rate==44100 and np.all(np.isfinite(audio))
                  assert .001<float(np.sqrt(np.mean(audio**2)))<.12
                  assert float(np.max(np.abs(audio)))<.6
          assert len(paths)==len(set(paths))==57
          assert [x["name"] for x in sounds["item.hoe.till"]["sounds"]] != [x["name"] for x in sounds["item.shovel.flatten"]["sounds"]]
          print("Alpha2: 19 distinct events, 57 valid unclipped audio variations; hoe and shovel no longer share sounds.")
          PY
      - name: Test block hits and non-special item fallback
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify repaired sounds are inside the actual JAR
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          jars = [x for x in pathlib.Path('build/libs').glob('*.jar') if '-sources' not in x.name]
          assert jars, 'No compiled Fabric JAR'
          for jar in jars:
              with zipfile.ZipFile(jar) as z:
                  names=set(z.namelist())
                  for item in ('fabric.mod.json', 'shatsu_catalog.json', 'assets/minecraft/sounds.json',
                               'assets/shatsu4/sounds.json', 'assets/clangor/sounds.json',
                               'assets/customblocksounds/config/blockmap.json',
                               'assets/shatsuv7/sounds/block/stone/hit_1.ogg',
                               'assets/shatsupolish/sounds.json',
                               'assets/shatsupolish/sounds/magic/xp/1.ogg',
                               'assets/shatsupolish/sounds/weapons/shield_raise/1.ogg',
                               'assets/shatsufresh/sounds.json',
                               'assets/shatsufresh/sounds/mace/hit/1.ogg',
                               'assets/shatsufresh/sounds/food/drink/1.ogg'):
                      assert item in names, (jar, item)
                  assert sum(x.endswith('.ogg') for x in names) >= 2300, (jar, 'missing OGGs')
                  print('JAR validated:', jar, len(names), 'packaged files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pixel-Eco-Shatsu-Retro-Audio-QA-and-Preview
          path: |
            build/generated/shatsu-assets/pixeleco_retro_report.json
            build/generated/shatsu-assets/pixeleco_interactions_qa.json
            build/generated/pixel-eco-retro-preview.mp3
            build/generated/pixel-eco-retro-preview.json
          if-no-files-found: warn
      - name: Label asset state
        id: assets
        run: echo "artifact=PixelEco-Retro-v0.6.6-Alpha2-REAL-SHATSU-FABRIC26.3" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assets.outputs.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error
